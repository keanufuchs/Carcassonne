name: full-game-playthrough
description: >
  Eine vollständige Partie wird regelkonform bis zum Spielende durchgespielt.
  Über den kanonischen 79-Kachel-Nachziehstapel (deckFrom: base-game) führt ein
  deterministischer, geseedeter Auto-Play (autoPlay.seed) jeden Zug aus: ziehen,
  legen, optional Meeple setzen — alles durch die echte Engine validiert. Jede von
  der Engine abgelehnte Aktion bricht den Lauf ab (kein Regelbruch, kein Absturz).
  Am Ende wird die korrekte Endabrechnung geprüft: Spiel im Status GAME_OVER, alle
  Kacheln gelegt, Nachziehstapel leer und feste, reproduzierbare Endpunktstände.

players: [Alice, Bob]

# Kanonischer Basisspiel-Stapel (79 Nachziehkacheln, ungemischt → deterministisch).
deckFrom: base-game

# Leer: die Züge werden vollständig vom deterministischen Auto-Play erzeugt.
steps: []

# Deterministischer Komplettdurchlauf bis GAME_OVER (gleicher Seed → gleiche Partie).
autoPlay:
  seed: 1

expect:
  phase: GAME_OVER
  placedTiles: 80          # 79 gelegte Nachziehkacheln + Startkachel
  deckRemaining: 0         # Stapel vollständig aufgebraucht
  scores: { Alice: 25, Bob: 17 }
