name: farmer-endgame-scoring
description: >
  Farmer werden nur bei Spielende gewertet. Bob setzt einen Farmer auf ein Feld,
  das an die abgeschlossene Start-Stadt grenzt. Nach endGame() erhält Bob
  3 Punkte pro angrenzender abgeschlossener Stadt.

players: [Alice, Bob]

steps:
  - { tile: TILE-E, at: { x: 0, y: -1 }, rotation: 180, skip: true }
  - { tile: TILE-B, at: { x: 0, y: 1 }, rotation: 0, meeple: { segment: 1 } }

endGame: true

expect:
  scores: { Alice: 0, Bob: 3 }
  meeplesAvailable: { Alice: 7, Bob: 6 }
  placedTiles: 3
