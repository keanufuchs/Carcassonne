name: road-closed-endpoints
description: >
  Eine Straße gilt erst als abgeschlossen, wenn beide Enden geschlossen sind.
  Start-Straße wird an beiden Enden mit TILE-W-Stummeln geschlossen: 3 Punkte,
  Meeple-Rückgabe.

players: [Alice, Bob]

steps:
  - { tile: TILE-W, at: { x: -1, y: 0 }, rotation: 0, skip: true }
  - { tile: TILE-W, at: { x: 1, y: 0 }, rotation: 0, meeple: { segment: 0 } }

padding: [TILE-B]

expect:
  scores: { Alice: 0, Bob: 3 }
  meeplesAvailable: { Alice: 7, Bob: 7 }
  completedFeatures:
    - { kind: ROAD, points: 3, tiles: 3 }
  placedTiles: 3
