site_name: Carcassonne — Projektdokumentation
site_description: Abschlussdokumentation des Software-Entwicklungsprojekts Carcassonne
repo_url: https://github.com/keanufuchs/Carcassonne
docs_dir: docs

theme:
  name: material
  language: de
  palette:
    - scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Dunkelmodus
    - scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Hellmodus
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.suggest

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Start: README.md
  - 01 — Einleitung & Zielsetzung: 01_einleitung.md
  - 02 — Projektmanagement: 02_projektmanagement.md
  - 03 — Anforderungen: 03_anforderungen.md
  - 04 — Architektur & Design: 04_architektur-design.md
  - 05 — User Interface: 05_user-interface.md
  - 06 — Implementierung: 06_implementierung.md
  - 07 — Qualitätssicherung: 07_qualitaetssicherung.md
  - 08 — Installation & Start: 08_installation-start.md
  - 09 — Code-Leitfaden: 09_code-leitfaden.md
  - 10 — Glossar & Anhang: 10_glossar-anhang.md
