<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Terracotta gradient matching the game's primary button aesthetic -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d96a4a" />
      <stop offset="100%" stop-color="#a3472d" />
    </linearGradient>

    <!-- Warm gold gradient for the meeple and borders -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a" />
      <stop offset="50%" stop-color="#d8a93f" />
      <stop offset="100%" stop-color="#9d6d15" />
    </linearGradient>

    <!-- Shadow for the meeple to lift it off the background -->
    <filter id="meepleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#4e1b0f" flood-opacity="0.6" />
    </filter>

    <!-- Global drop shadow for the 3D tile badge -->
    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#281e12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 3D Bevel/Lip Shadow (offset downwards) -->
  <rect x="6" y="10" width="88" height="84" rx="20" fill="#7f3420" />

  <!-- Main Top Tile with Gold Border and Shadow -->
  <rect x="6" y="6" width="88" height="84" rx="20" fill="url(#terracottaGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#tileShadow)" />

  <!-- Medieval-style dotted inner border -->
  <rect x="13" y="13" width="74" height="70" rx="14" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.75" />

  <!-- Iconic Carcassonne Meeple in Gold in the center -->
  <path
    d="M 35 90 L 15 90 L 22 60 L 5 50 L 10 35 L 30 35 C 30 10, 70 10, 70 35 L 90 35 L 95 50 L 78 60 L 85 90 L 65 90 L 50 70 Z"
    fill="url(#goldGrad)"
    stroke="#7f5411"
    stroke-width="2"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#meepleShadow)"
    transform="translate(17.5, 15.5) scale(0.65)"
  />
</svg>