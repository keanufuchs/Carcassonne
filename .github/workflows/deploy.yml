name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -- --mode production
        env:
          VITE_WS_URL: wss://carcassonne.spelk.de/ws
          VITE_API_URL: https://carcassonne.spelk.de

          VITE_AI_BASE_URL: ${{ vars.VITE_AI_BASE_URL }}
          VITE_AI_API_KEY: ${{ secrets.VITE_AI_API_KEY }}
          VITE_AI_MODELS: ${{ vars.VITE_AI_MODELS }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/carcassonne-app

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Install dependencies (production only for server)
            npm ci

            # Restart backend via PM2
            pm2 restart ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save

      - name: Copy frontend build to webroot
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'dist/*'
          target: '/var/www/carcassonne.spelk.de'
          strip_components: 1
