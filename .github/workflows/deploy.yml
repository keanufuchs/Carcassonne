name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    name: Build & Deploy (Production)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -- --mode production
        env:
          VITE_WS_URL: wss://carcassonne.spelk.de/ws
          VITE_API_URL: https://carcassonne.spelk.de
          # Intelligent AI agent (EW-02) — baked into the client bundle.
          # NOTE: VITE_* vars are exposed in the public JS bundle.
          VITE_AI_API_KEY: ${{ secrets.VITE_AI_API_KEY }}
          VITE_AI_BASE_URL: ${{ vars.VITE_AI_BASE_URL }}
          VITE_AI_MODELS: ${{ vars.VITE_AI_MODELS }}
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Write build ID
        run: echo "${{ github.sha }}" > dist/build-id.txt

      - name: Deploy backend to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/carcassonne-app

            git fetch origin main
            git reset --hard origin/main

            rm -rf node_modules
            npm ci

            pm2 restart ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save

      # rsync --delete mirrors the build into the webroot, removing stale
      # hashed bundles from previous deploys (scp would leave them behind).
      - name: Deploy frontend to webroot
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/carcassonne.spelk.de/"

  deploy-staging:
    name: Build & Deploy (Staging)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -- --mode production
        env:
          VITE_WS_URL: wss://carcassonne.dev.spelk.de/ws
          VITE_API_URL: https://carcassonne.dev.spelk.de
          VITE_AI_API_KEY: ${{ secrets.VITE_AI_API_KEY }}
          VITE_AI_BASE_URL: ${{ vars.VITE_AI_BASE_URL }}
          VITE_AI_MODELS: ${{ vars.VITE_AI_MODELS }}
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Write build ID
        run: echo "${{ github.sha }}" > dist/build-id.txt

      - name: Deploy frontend to staging webroot
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/carcassonne.dev.spelk.de/"
