name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-production:
    name: Build & Deploy (Production)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -- --mode production
        env:
          VITE_WS_URL: wss://carcassonne.spelk.de/ws
          VITE_API_URL: https://carcassonne.spelk.de
          # Reasoning AI (EW-02): the LLM call now runs SERVER-SIDE (server/aiService.ts),
          # so the API key must NOT be baked into the public client bundle. Only the
          # (non-sensitive) model list is exposed, for the setup dropdown. The key is
          # injected into the backend in the "Deploy backend to VPS" step below.
          VITE_AI_MODELS: ${{ vars.VITE_AI_MODELS }}
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Write build ID
        run: echo "${{ github.sha }}" > dist/build-id.txt

      - name: Deploy backend to VPS
        uses: appleboy/ssh-action@v1
        env:
          # Server-side Reasoning-AI credentials (EW-02). Reuses the existing
          # secret/vars; forwarded into the remote shell via `envs:` below. The key
          # stays on the server and is never shipped in the client bundle.
          AI_API_KEY: ${{ secrets.VITE_AI_API_KEY }}
          AI_BASE_URL: ${{ vars.VITE_AI_BASE_URL }}
          AI_MODELS: ${{ vars.VITE_AI_MODELS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: AI_API_KEY,AI_BASE_URL,AI_MODELS
          script: |
            set -e
            cd /var/www/carcassonne-app

            git fetch origin main
            git reset --hard origin/main

            # Persist server-side AI credentials to .env (read by server/loadEnv.ts).
            # Upsert the AI_* keys without clobbering any other existing entries.
            touch .env
            grep -v -E '^(AI_API_KEY|AI_BASE_URL|AI_MODELS)=' .env > .env.tmp || true
            {
              echo "AI_API_KEY=${AI_API_KEY}"
              echo "AI_BASE_URL=${AI_BASE_URL}"
              echo "AI_MODELS=${AI_MODELS}"
            } >> .env.tmp
            mv .env.tmp .env
            chmod 600 .env

            rm -rf node_modules
            npm ci

            pm2 restart ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save

      # rsync --delete mirrors the build into the webroot, removing stale
      # hashed bundles from previous deploys (scp would leave them behind).
      - name: Deploy frontend to webroot
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/carcassonne.spelk.de/"

  deploy-staging:
    name: Build & Deploy (Staging)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -- --mode production
        env:
          VITE_WS_URL: wss://carcassonne.dev.spelk.de/ws
          VITE_API_URL: https://carcassonne.dev.spelk.de
          # See production build above: the AI key is server-side only; the client
          # bundle gets just the model list. Staging deploys frontend only — the
          # staging backend must have AI_API_KEY/AI_BASE_URL/AI_MODELS in its env.
          VITE_AI_MODELS: ${{ vars.VITE_AI_MODELS }}
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Write build ID
        run: echo "${{ github.sha }}" > dist/build-id.txt

      - name: Deploy frontend to staging webroot
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/carcassonne.dev.spelk.de/"
